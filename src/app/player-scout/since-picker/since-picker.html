<div class="since" role="group" aria-label="The projection to compare with">
  <button
    type="button"
    class="segment"
    [class.segment--active]="!on()"
    [attr.aria-pressed]="!on()"
    (click)="pickOff()"
  >
    Off
  </button>
  <button
    type="button"
    class="segment"
    [class.segment--active]="on() && since() === null"
    [attr.aria-pressed]="on() && since() === null"
    (click)="pickPreseason()"
  >
    Preseason
  </button>
  <!-- The day: a segment wearing the day, with the platform's date field hidden under it so the
       segment can open the picker. The field is the picker's vehicle, not a stop of its own. -->
  <span class="day">
    <button
      type="button"
      class="segment segment--day"
      [class.segment--active]="dayPicked()"
      [attr.aria-pressed]="dayPicked()"
      [attr.aria-label]="since() ? 'A day of your own: ' + dayLabel() : 'A day of your own'"
      [disabled]="noDayYet()"
      [appTooltip]="dayTip()"
      (click)="pickDay()"
    >
      <app-icon name="calendar-days" [size]="14" />
      <span class="day-text">{{ dayLabel() }}</span>
    </button>
    <input
      #field
      class="day-field"
      type="date"
      tabindex="-1"
      aria-hidden="true"
      [min]="earliest()"
      [max]="latest()"
      [value]="since() ?? ''"
      (change)="onDate($event)"
    />
  </span>
</div>
