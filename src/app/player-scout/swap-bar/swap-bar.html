<app-icon class="swap-icon" name="user-minus" />
<p class="swap-text">
  Dropping <strong>{{ name() }}</strong>
  @if (loss(); as loss) {
    &ngsp;<span class="swap-muted">· your lineup loses</span>&ngsp;
    <strong>{{ loss }} {{ unit() }}</strong>
  }
</p>
<div class="swap-actions">
  <button type="button" class="swap-change" (click)="pickAnother.emit()">Change</button>
  <button type="button" class="swap-clear" aria-label="Clear drop" (click)="cleared.emit()">
    <app-icon name="close" />
  </button>
</div>
