@if (show()) {
  <aside class="pool-notice" role="note">
    <span class="pool-notice__icon">
      <app-icon name="info" />
    </span>
    <div class="pool-notice__body">
      <p class="pool-notice__title">Player list updated</p>
      <p class="pool-notice__body-text">
        {{ newPlayerCount() }} {{ newPlayerCount() === 1 ? 'player has' : 'players have' }} been
        added to the league since you created this projection.
      </p>
      <p class="pool-notice__footer">Your existing projections are unchanged.</p>
      <div class="pool-notice__actions">
        <label class="pool-notice__filter" for="new-players-only">
          <input
            id="new-players-only"
            type="checkbox"
            [checked]="newPlayersOnly()"
            (change)="newPlayersOnly.set(!newPlayersOnly())"
          />
          View new players only
        </label>
        <button type="button" class="btn btn-secondary btn-sm" (click)="acknowledged.emit()">
          Got it
        </button>
      </div>
    </div>
  </aside>
}
